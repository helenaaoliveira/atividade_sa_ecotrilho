<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotas</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="system-body">
    <aside class="sidebar">
    <h2>🚂 Ferrorama</h2>
    <nav>
        <a href="dashboard.html">
            <i class="fa-solid fa-chart-line"></i>
            Dashboard
        </a>

        <a href="trens.html">
            <i class="fa-solid fa-train"></i>
            Trens
        </a>

        <a href="sensores.html">
            <i class="fa-solid fa-gauge-high"></i>
            Sensores
        </a>

        <a href="rotas.html">
            <i class="fa-solid fa-route"></i>
            Rotas
        </a>

        <a href="relatorios.html">
            <i class="fa-solid fa-file-lines"></i>
            Relatórios
        </a>

        <a href="usuarios.html">
            <i class="fa-solid fa-users"></i>
            Usuários
        </a>

        <a href="perfil.html">
            <i class="fa-solid fa-user-circle"></i>
            Meu Perfil
        </a>

        <a href="configuracoes.html">
            <i class="fa-solid fa-gear"></i>
            Configurações
        </a>

        <a href="#" onclick="logout(); return false;">
            <i class="fa-solid fa-right-from-bracket"></i>
            Sair
        </a>
    </nav>
</aside>

    <main class="main">
        <div class="topbar">
            <h1>Gerenciamento de Rotas</h1>

            <button class="btn-add" onclick="abrirModalRota()">
                Nova Rota
            </button>
        </div>

        <div class="cards">
            <div class="card">
                <h2 id="totalRotas">
                    0
                </h2>

                <p>
                    Total de Rotas
                </p>
            </div>

            <div class="card">
                <h2 id="rotasAtivas">
                    0
                </h2>

                <p>
                    Rotas Ativas
                </p>
            </div>

            <div class="card">
                <h2 id="rotasManutencao">
                    0
                </h2>

                <p>
                    Em Manutenção
                </p>
            </div>
        </div>

        <div class="trens-top">
            <input type="text" id="pesquisa" placeholder="Pesquisar rota..." onkeyup="filtrarRotas()">

            <select id="filtroStatus" onchange="filtrarRotas()">
                <option value="">
                    Todos
                </option>

                <option value="Ativa">
                    Ativa
                </option>

                <option value="Manutenção">
                    Manutenção
                </option>

                <option value="Parada">
                    Parada
                </option>
            </select>

            <button class="btn-add" onclick="ordenarRotas()">
                Ordenar
            </button>
        </div>

        <div class="trens-container">
            <div class="trens-lista">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Origem</th>
                            <th>Destino</th>
                            <th>Distância</th>
                            <th>Trem</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaRotas">

                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal" id="modalRota">
        <div class="modal-content">
            <h2 id="tituloModal">
                Nova Rota
            </h2>

            <input type="hidden" id="idRota">
            <input type="text" id="nomeRota" placeholder="Nome da Rota">
            <input type="text" id="origem" placeholder="Origem">
            <input type="text" id="destino" placeholder="Destino">
            <input type="text" id="distancia" placeholder="Distância">

            <select id="trem">
                <option value="">
                    Selecione um trem
                </option>

            </select>

            <select id="status">
                <option value="Ativa">
                    Ativa
                </option>

                <option value="Manutenção">
                    Manutenção
                </option>

                <option value="Parada">
                    Parada
                </option>
            </select>

            <div class="modal-buttons">
                <button class="btn-add" onclick="salvarRota()">
                    Salvar
                </button>

                <button class="btn-delete" onclick="fecharModalRota()">
                    Cancelar
                </button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/rotas.js"></script>
</body>
</html>
