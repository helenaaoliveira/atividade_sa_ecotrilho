<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="system-body">
    <aside class="sidebar">
    <h2>🚂 Ferrorama</h2>
    <nav>
        <a href="dashboard.html">
            <i class="fa-solid fa-chart-line"></i>
            Dashboard
        </a>

        <a href="trens.html">
            <i class="fa-solid fa-train"></i>
            Trens
        </a>

        <a href="sensores.html">
            <i class="fa-solid fa-gauge-high"></i>
            Sensores
        </a>

        <a href="rotas.html">
            <i class="fa-solid fa-route"></i>
            Rotas
        </a>

        <a href="relatorios.html">
            <i class="fa-solid fa-file-lines"></i>
            Relatórios
        </a>

        <a href="usuarios.html">
            <i class="fa-solid fa-users"></i>
            Usuários
        </a>

        <a href="perfil.html">
            <i class="fa-solid fa-user-circle"></i>
            Meu Perfil
        </a>

        <a href="configuracoes.html">
            <i class="fa-solid fa-gear"></i>
            Configurações
        </a>

        <a href="#" onclick="logout(); return false;">
            <i class="fa-solid fa-right-from-bracket"></i>
            Sair
        </a>
    </nav>
</aside>

    <main class="main">
        <div class="topbar">
            <h1>Relatórios do Sistema</h1>
        </div>

        <div class="cards">
            <div class="card">
                <h2 id="resumoTrens">0</h2>
                <p>Total de Trens</p>
            </div>

            <div class="card">
                <h2 id="resumoSensores">0</h2>
                <p>Total de Sensores</p>
            </div>
        </div>

        <div class="relatorio-filtros">
            <select id="tipoRelatorio">
                <option value="trens">Relatório de Trens</option>
                <option value="sensores">Relatório de Sensores</option>
            </select>

            <button class="btn-add" onclick="gerarRelatorio()">Gerar Relatório</button>
            <button class="btn-pdf" onclick="exportarPDF()">Exportar PDF</button>
            <button class="btn-add" onclick="exportarCSV()">Exportar CSV</button>
        </div>
        <div id="resultadoRelatorio"></div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/relatorios.js"></script>
</body>
</html>
