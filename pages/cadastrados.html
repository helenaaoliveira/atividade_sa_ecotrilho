<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrados</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="system-body">
    <aside class="sidebar">
        <h2>🚂 Ferrorama</h2>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="trens.html">Trens</a>
            <a href="sensores.html">Sensores</a>
            <a href="rotas.html">Rotas</a>
            <a id="menuRelatorios" href="relatorios.html">Relatórios</a>
            <a id="menuUsuarios" href="usuarios.html">Usuários</a>
            <a id="menuConfiguracoes" href="configuracoes.html">Configurações</a>
            <a href="#" onclick="logout()">Sair</a>
        </nav>
    </aside>

    <main class="main cadastrados-main">
        <div class="cadastrados-topo">
            <h1>Cadastrados</h1>

            <button class="btn-adicionar" onclick="abrirModal()">
                <i class="fa-solid fa-plus"></i>
                Adicionar usuário
            </button>
        </div>

        <div class="cadastrados-filtros">
            <div class="campo-busca">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="busca" placeholder="Buscar usuário..." onkeyup="filtrarCadastrados()">
            </div>

            <select id="perfilFiltro" onchange="filtrarCadastrados()">

                <option value="">
                    Todos os perfis
                </option>

                <option value="Admin">
                    Admin
                </option>

                <option value="Operador">
                    Operador
                </option>

                <option value="Técnico">
                    Técnico
                </option>
            </select>
        </div>

        <div class="cadastrados-tabela-container">
            <table class="tabela-cadastrados">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Perfil</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="tabelaCadastrados">

                </tbody>
            </table>
        </div>

        <div class="paginacao">
            <button onclick="paginaAnteriorCadastrados()">
                &lt;
            </button>

            <button id="pagina1" class="pagina-ativa" onclick="irParaPaginaCadastrados(1)">
                1
            </button>

            <button id="pagina2" onclick="irParaPaginaCadastrados(2)">
                2
            </button>

            <button onclick="proximaPaginaCadastrados()">
                &gt;
            </button>
        </div>
    </main>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="tituloModal">
                Novo Usuário
            </h2>

            <input type="hidden" id="usuarioId">
            <input type="text" id="nome" placeholder="Nome">
            <input type="text" id="usuario" placeholder="Usuário">
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="senha" placeholder="Senha">

            <select id="perfil">
                <option value="Admin">
                    Administrador
                </option>

                <option value="Operador">
                    Operador
                </option>

                <option value="Técnico">
                    Técnico
                </option>
            </select>

            <div class="modal-buttons">
                <button class="btn-add" onclick="salvarCadastrado()">
                    Salvar
                </button>

                <button class="btn-delete" onclick="fecharModal()">
                    Cancelar
                </button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/cadastrados.js"></script>
</body>

</html>
